<div class="mx-auto w-full max-w-3xl">
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/80">
      <h2 class="text-sm font-semibold text-slate-800">Share survey</h2>
      <p class="text-xs text-slate-400 mt-0.5">
        Add everyone you want to invite, then send all shares at once.
      </p>
    </div>

    <div class="px-5 py-5">
      <div
        class="hidden sm:grid grid-cols-[minmax(0,1.4fr)_minmax(0,1fr)_minmax(0,1fr)_4.75rem] gap-3 mb-2"
      >
        <span class="text-xs font-medium text-slate-500">
          Email <span class="text-red-500">*</span>
        </span>
        <span class="text-xs font-medium text-slate-500">First name</span>
        <span class="text-xs font-medium text-slate-500">Last name</span>
        <span class="sr-only">Actions</span>
      </div>

      <div class="flex flex-col gap-3">
        @for (responder of responders(); track responder.id) {
          <div
            class="grid grid-cols-1 sm:grid-cols-[minmax(0,1.4fr)_minmax(0,1fr)_minmax(0,1fr)_4.75rem] gap-2 sm:gap-3 sm:items-start"
          >
            <div class="flex flex-col gap-1">
              <label
                class="text-xs font-medium text-slate-500 sm:sr-only"
                [for]="'share-email-' + responder.id"
              >
                Email <span class="text-red-500">*</span>
              </label>
              <input
                [id]="'share-email-' + responder.id"
                type="email"
                autocomplete="off"
                class="w-full border rounded-lg px-3 py-2 text-sm text-slate-800 placeholder:text-slate-300 focus:outline-none focus:ring-2 transition-colors disabled:opacity-50"
                [class.border-slate-200]="!fieldError(responder.id, 'email')"
                [class.focus:border-emerald-500]="!fieldError(responder.id, 'email')"
                [class.focus:ring-emerald-500/20]="!fieldError(responder.id, 'email')"
                [class.border-red-300]="fieldError(responder.id, 'email')"
                [class.focus:border-red-400]="fieldError(responder.id, 'email')"
                [class.focus:ring-red-400/20]="fieldError(responder.id, 'email')"
                placeholder="name@example.com"
                [value]="responder.email"
                [disabled]="submitting()"
                (input)="updateField(responder.id, 'email', $event)"
              />
              @if (fieldError(responder.id, 'email'); as message) {
                <p class="text-xs text-red-500">{{ message }}</p>
              }
            </div>

            <div class="flex flex-col gap-1">
              <label
                class="text-xs font-medium text-slate-500 sm:sr-only"
                [for]="'share-first-' + responder.id"
              >
                First name
              </label>
              <input
                [id]="'share-first-' + responder.id"
                type="text"
                autocomplete="off"
                class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder:text-slate-300 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-colors disabled:opacity-50"
                placeholder="Optional"
                [value]="responder.firstName"
                [disabled]="submitting()"
                (input)="updateField(responder.id, 'firstName', $event)"
              />
            </div>

            <div class="flex flex-col gap-1">
              <label
                class="text-xs font-medium text-slate-500 sm:sr-only"
                [for]="'share-last-' + responder.id"
              >
                Last name
              </label>
              <input
                [id]="'share-last-' + responder.id"
                type="text"
                autocomplete="off"
                class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder:text-slate-300 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-colors disabled:opacity-50"
                placeholder="Optional"
                [value]="responder.lastName"
                [disabled]="submitting()"
                (input)="updateField(responder.id, 'lastName', $event)"
              />
            </div>

            <div class="flex sm:justify-end">
              <button
                type="button"
                class="inline-flex items-center justify-center h-[38px] w-full sm:w-[4.75rem] px-3 rounded-lg border border-slate-200 text-xs font-medium text-slate-500 bg-white hover:bg-slate-50 hover:text-slate-700 disabled:opacity-40 disabled:pointer-events-none transition-colors"
                [disabled]="submitting() || responders().length <= 1"
                (click)="removeResponder(responder.id)"
              >
                Remove
              </button>
            </div>
          </div>
        }
      </div>

      <button
        type="button"
        class="mt-4 inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-dashed border-slate-300 text-sm font-medium text-slate-600 bg-slate-50/50 hover:bg-slate-50 hover:border-slate-400 disabled:opacity-40 disabled:pointer-events-none transition-colors"
        [disabled]="submitting()"
        (click)="addResponder()"
      >
        + Add responder
      </button>

      @if (errorMessage(); as message) {
        <p class="mt-4 text-sm text-red-500 leading-relaxed">{{ message }}</p>
      }
    </div>

    <div class="flex items-center justify-end gap-3 px-5 py-4 border-t border-slate-100 bg-slate-50/50">
      <button
        type="button"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-600 text-sm font-medium text-white hover:bg-emerald-700 disabled:opacity-40 disabled:pointer-events-none transition-colors"
        [disabled]="submitting() || !canSend()"
        (click)="send()"
      >
        @if (submitting()) {
          Sending…
        } @else {
          Send shares
        }
      </button>
    </div>
  </div>
</div>
