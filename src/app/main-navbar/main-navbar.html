<div
  class="relative w-80 bg-gray-200 rounded-full p-1 flex justify-between border-2 border-gray-500"
>
  <!-- Sliding indicator -->
  <div
    class="absolute top-0 left-0 h-full w-1/2 bg-gray-500 rounded-full transition-all duration-300"
    [style.transform]="isBuild() ? 'translateX(0%)' : 'translateX(100%)'"
  ></div>

  <!-- Buttons -->
  <button
    (click)="navigateToBuild()"
    class="relative z-10 w-1/2 text-center py-2 font-semibold transition-colors duration-150"
    [ngClass]="isBuild() ? 'text-white' : 'text-gray-700'"
  >
    Build
  </button>
  <button
    (click)="navigateToView()"
    class="relative z-10 w-1/2 text-center py-2 font-semibold transition-colors duration-150"
    [ngClass]="isView() ? 'text-white' : 'text-gray-700'"
  >
    View
  </button>
</div>
