<aside
  cdkDropList
  id="palette"
  [cdkDropListConnectedTo]="['form-drop']"
  cdkDropListSortingDisabled
  cdkDropListHasAnchor
  class="text-white flex flex-col gap-4"
>
  @for (uiType of uiTypes; track uiType) {
  <app-ui-type-icon [uiType]="uiType" cdkDrag [cdkDragData]="uiType.groupType">
    <div class="sidebar-placeholder" *cdkDragPlaceholder></div>
  </app-ui-type-icon>
  }
</aside>
