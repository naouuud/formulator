<!-- TOP LABEL ("Address") -->
<label class="block text-md font-medium text-gray-900 mb-2">
  {{ field.label }}
</label>
<div class="flex flex-col gap-4 px-4 pt-2 pb-4 border border-gray-300 rounded-md">
  @for (field of field.fields; track $index) {
  <!-- TEXT FIELD FOR STREET AND CITY -->
  @if (field.type === FieldType.TEXT) {
  <div>
    <label [for]="field.fieldId" class="block text-md font-medium text-gray-900">
      {{ field.label }}
    </label>
    <input
      [id]="field.fieldId"
      type="text"
      class="mt-1 block w-full bg-gray-50 p-2 pr-14 border border-gray-300 rounded-md focus:ring-gray-500 focus:border-gray-500 placeholder-gray-400"
      [placeholder]="field.placeholder"
      [attr.maxlength]="field.maxLength"
    />
  </div>
  }
  <!-- SELECT FIELD FOR GOVERNORATE AND DISTRICT -->
  @if (field.type === FieldType.SELECT) {
  <div>
    <label class="block text-md font-medium text-gray-900"> {{ field.label }} </label>
    <!-- GOVERNORATE (FIXED OPTIONS) -->
    @if (field.options.length > 0) {
    <select
      (input)="toggleDistrict($event)"
      class="mt-1 block w-full bg-gray-50 p-2 border-1 border-gray-300 rounded-md focus:ring-gray-500 focus:border-gray-500 placeholder:text-gray-400"
    >
      <option [value]="null" disabled selected class="text-gray-800">
        {{ field.placeholder && field.placeholder.length > 0 ? field.placeholder : '---' }}
      </option>
      @for (option of field.options; track $index) {
      <option [value]="option.value" class="text-gray-800">
        {{ option.label }}
      </option>
      }
    </select>
    <!-- DISTRICT (DYNAMIC OPTIONS) -->
    } @else {
    <select
      class="mt-1 block w-full bg-gray-50 p-2 border-1 border-gray-300 rounded-md focus:ring-gray-500 focus:border-gray-500 placeholder:text-gray-400"
    >
      <option [value]="null" disabled selected class="text-gray-800">
        {{ field.placeholder && field.placeholder.length > 0 ? field.placeholder : '---' }}
      </option>
      @for (district of districts(); track $index) {
      <option [value]="district.value" class="text-gray-800">
        {{ district.name }}
      </option>
      }
    </select>
    }
  </div>
  }}
</div>
