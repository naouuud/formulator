<div
  class="p-4 bg-gray-600/80 backdrop-blur-md border-b border-white/10 shadow-md rounded-2xl hover:cursor-pointer"
>
  <div class="flex gap-2 items-center">
    <img
      [src]="'assets/' + factoryIcon.img"
      alt="{{ factoryIcon.label }} input"
      class="text-sm w-[30px]"
    />
    <p class="text-sm">{{ factoryIcon.label }}</p>
  </div>
  @if (factoryIcon.description) {
    <p class="text-xs">
      {{ factoryIcon.description }}
    </p>
  }
</div>
