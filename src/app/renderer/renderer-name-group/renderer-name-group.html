<div class="flex gap-4 w-full">
  @for (field of group.fields; track $index) { @if (field.type === FieldType.TEXT &&
  isTextField(field)) {
  <div class="flex flex-col flex-1">
    <label [for]="field.fieldId" class="block text-md font-medium text-gray-900 mb-1">
      {{ field.label }}
    </label>
    <div [formGroup]="formGroupIn">
      <input
        [id]="field.fieldId"
        [formControlName]="field.fieldId"
        type="text"
        class="block w-full max-w-md bg-gray-50 p-2 pr-14 border border-gray-300 rounded-md focus:ring-gray-500 focus:border-gray-500 placeholder-gray-400"
        [placeholder]="field.placeholder"
        [attr.maxlength]="field.maxLength"
      />
    </div>
  </div>
  } }
</div>
