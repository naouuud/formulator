<div class="p-4 bg-gray-600/80 backdrop-blur-md border-b border-white/10 shadow-md rounded-lg">
  <div class="flex gap-2 items-center">
    <img [src]="'assets/' + type.img" alt="{{ type.name }} input" class="text-sm w-[30px]" />
    <p class="font-[300] text-sm">{{ type.name }}</p>
  </div>
  @if (type.description) {
  <p class="font-[300] text-xs">
    {{ type.description }}
  </p>
  }
</div>
