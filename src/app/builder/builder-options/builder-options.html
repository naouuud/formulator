<div
  class="flex flex-col gap-2"
  (mouseenter)="dragDisabled$.set(true)"
  (mouseleave)="dragDisabled$.set(false)"
>
  <span class="px-4 py-1 text-xs uppercase text-gray-400">Options </span>
  <div class="flex flex-col gap-3 px-2 py-3 rounded-[24px] border border-gray-300 bg-gray-100">
    <!-- Input -->
    <div class="flex items-center gap-2">
      <input
        #optionInput
        type="text"
        placeholder="Add option..."
        class="flex-1 px-3 py-2 text-sm rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400"
        (keydown.enter)="addOption_C(optionInput)"
      />
      <!-- Add button -->
      <button
        type="button"
        class="px-3 py-2 text-sm font-medium rounded-full bg-blue-500 text-white hover:bg-blue-600 active:scale-95 transition"
        (click)="addOption_C(optionInput)"
      >
        Add
      </button>
    </div>
    <!-- Options list -->
    <div
      class="flex flex-col gap-2"
      cdkDropList
      (cdkDropListDropped)="reorderOption_C($event)"
      cdkDropListOrientation="mixed"
    >
      @if (!field.getOptions().length) {
        <div class="px-4 py-1 text-gray-500">No options to display</div>
      }
      @for (option of field.getOptions(); track $index) {
        <div
          cdkDrag
          class="flex justify-between items-center gap-2 px-4 py-1.5 rounded-full border border-gray-200 text-sm text-gray-700 hover:cursor-pointer hover:bg-white"
        >
          <!-- List type (radio, checkbox or basic) -->
          @if (field.fieldType === FieldType.RADIO) {
            <app-custom-radio [option]="option"></app-custom-radio>
          } @else if (field.fieldType === FieldType.CHECKBOX) {
            <app-custom-checkbox [option]="option"></app-custom-checkbox>
          } @else {
            <span>{{ option }}</span>
          }
          <!-- Delete button -->
          <button
            type="button"
            class="flex justify-center w-4 h-4 rounded-full text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
            aria-label="Remove option"
            (click)="deleteOption_C($index)"
          >
            <svg
              viewBox="0 0 24 24"
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <line x1="9" y1="9" x2="15" y2="15" />
              <line x1="15" y1="9" x2="9" y2="15" />
            </svg>
          </button>
          <div *cdkDragPlaceholder class="empty-pill"></div>
        </div>
      }
      <!-- Other Option (visual) -->
      @if (optionOtherValue) {
        <app-option-other [fieldType]="field.fieldType" />
      }
    </div>
    <!-- Other Option Prop -->
    @if (optionOtherProp) {
      <div class="px-4 py-1 text-sm rounded-[20px] bg-gray-100/75 border border-gray-300">
        <label class="flex items-center justify-between min-h-8 cursor-pointer">
          <span class="text-gray-500 text-xs uppercase">Allow responder to choose 'Other'</span>
          <div class="relative">
            <input
              type="checkbox"
              [formControlName]="PropType.OPTIONOTHER"
              (change)="updateOptionOtherValue($event)"
              class="sr-only peer"
            />
            <div
              class="w-9 h-5 rounded-full bg-gray-300 peer-checked:bg-gray-700 transition-colors"
            ></div>
            <div
              class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white transition-transform peer-checked:translate-x-4"
            ></div>
          </div>
        </label>
      </div>
    }
  </div>
</div>
