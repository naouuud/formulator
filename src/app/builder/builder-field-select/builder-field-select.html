<div class="flex flex-col gap-2">
  <!-- Label -->
  <app-builder-prop-label [labelMessage]="'Ask your responder a question...'" />
  <!-- Preview -->
  <div class="relative">
    <select
      class="appearance-none pr-10 pl-3 py-2 rounded-md border border-gray-300 bg-white text-sm focus:outline-none w-full text-gray-700"
      (mouseenter)="dragDisabled$.set(true)"
      (mouseleave)="dragDisabled$.set(false)"
    >
      <option class="text-gray-400">Selection preview</option>
      @for (option of field.options; track $index) {
        <option class="text-gray-700">{{ option }}</option>
      }
    </select>
    <svg
      class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-500"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path d="M5.25 7.5L10 12.25L14.75 7.5" />
    </svg>
  </div>
  <!-- Options Panel  -->
  <app-builder-options [field]="field" />
  <!-- Validation -->
  <app-builder-validation [field]="field" />
</div>
