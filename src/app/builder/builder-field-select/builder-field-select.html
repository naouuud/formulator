<div class="flex flex-col gap-2">
  <!-- Label -->
  <app-builder-prop-label [labelMessage]="'Ask your responder a question...'" />
  <!-- Flex -->
  <div class="flex gap-2 w-full">
    <!-- Options Panel  -->
    <div class="flex-1">
      <app-builder-options [field]="field" />
    </div>
    <!-- Preview -->
    <div class="flex-1 flex flex-col gap-2">
      <span class="px-4 py-1 text-xs uppercase text-gray-400">Preview</span>
      <div class="relative flex-1">
        <select
          class="appearance-none pr-10 pl-3 py-2 rounded-full border border-gray-300 bg-white text-sm focus:outline-none w-full text-gray-700"
          (mouseenter)="dragDisabled$.set(true)"
          (mouseleave)="dragDisabled$.set(false)"
          (click)="log($event)"
          [autofocus]="true"
        >
          <option class="text-gray-400" disabled>Select an option</option>
          @for (option of field.getOptions(); track $index) {
            <option class="text-gray-700">{{ option }}</option>
          }
        </select>
        <svg
          class="pointer-events-none absolute right-3 top-5 -translate-y-1/2 h-4 w-4 text-gray-500"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path d="M5.25 7.5L10 12.25L14.75 7.5" />
        </svg>
      </div>
    </div>
  </div>
  <!-- Validation -->
  <app-builder-validation [field]="field" />
</div>
