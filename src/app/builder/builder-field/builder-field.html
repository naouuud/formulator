<div [formGroup]="formGroup">
  @switch (field.fieldType) { @case (FieldType.TEXT) {
  <app-builder-field-text [field]="field" />
  } @case (FieldType.TEXTAREA) {
  <app-builder-field-textarea [field]="field" />
  } @case (FieldType.SELECT) {
  <app-builder-field-select [field]="field" />
  } @case (FieldType.RADIO) {
  <app-builder-field-option [field]="field" />
  } @case (FieldType.CHECKBOX) {
  <app-builder-field-option [field]="field" />
  } @case (FieldType.DATE) {
  <app-builder-field-date [field]="field" />
  } @default {}}
</div>
