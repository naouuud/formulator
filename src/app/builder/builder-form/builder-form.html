<div
  cdkDropList
  id="form-drop"
  [cdkDropListConnectedTo]="['palette']"
  (cdkDropListDropped)="onDrop($event)"
>
  <app-builder-form-title [formModel]="formModel" />
  @for (group of formModel.groups; track group) {
  <app-builder-group [formModel]="formModel" [group]="group"> </app-builder-group>
  }
</div>
