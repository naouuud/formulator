<div [formGroup]="formGroup" class="flex flex-col">
  <!-- Label -->
  <input
    type="text"
    class="bg-gray-200 block text-lg font-medium mb-2 text-gray-900 p-2 border border-gray-300 rounded-md"
    placeholder="Enter a label for your field, e.g. 'Favorite pet'"
    formControlName="label"
  />
  <!-- Placeholder -->
  <input
    type="text"
    class="block w-full bg-gray-50 p-2 pr-14 border border-gray-300 rounded-md focus:ring-gray-500 focus:border-gray-500 placeholder-gray-400 text-gray-400"
    placeholder="Enter a placeholder, e.g. 'Enter pet name here...' or leave blank"
    formControlName="placeholder"
  />
  <!-- Validation -->
  <div class="mt-3 p-3 rounded-lg border border-gray-200 bg-gray-50/50">
    <button type="button" class="validation-header" (click)="isValidationOpen = !isValidationOpen">
      <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Validation</h4>
      <!-- Chevron -->
      <svg
        class="chevron"
        [class.open]="isValidationOpen"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <!-- Collapsible area -->
    <div class="validation-content" [class.collapsed]="!isValidationOpen" ]>
      <div class="flex flex-col gap-2 p-2">
        <!-- Required  -->
        <label class="flex items-center justify-between text-sm text-gray-600 cursor-pointer">
          <span>Required</span>
          <div class="relative">
            <input type="checkbox" formControlName="required" class="sr-only peer" />
            <div
              class="w-9 h-5 rounded-full bg-gray-300 peer-checked:bg-gray-700 transition-colors"
            ></div>
            <div
              class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white transition-transform peer-checked:translate-x-4"
            ></div>
          </div>
        </label>
        <!-- Max length -->
        <div class="flex items-center justify-between text-sm text-gray-600">
          <span>Max length</span>
          <div class="flex items-center gap-2">
            <select
              formControlName="maxlength"
              class="w-20 bg-white border border-gray-300 rounded-md px-2 py-1 text-sm focus:ring-1 focus:ring-gray-400 focus:border-gray-500"
            >
              @for (n of array; track $index) {
              <option [value]="n">{{ n }}</option>
              }
            </select>
            <span>characters</span>
          </div>
        </div>
        <!-- Min length -->
        <div class="flex items-center justify-between text-sm text-gray-600">
          <span>Min length</span>
          <div class="flex items-center gap-2">
            <select
              formControlName="minlength"
              class="w-20 bg-white border border-gray-300 rounded-md px-2 py-1 text-sm focus:ring-1 focus:ring-gray-400 focus:border-gray-500"
            >
              @for (n of array; track $index) {
              <option [value]="n">{{ n }}</option>
              }
            </select>
            <span>characters</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
