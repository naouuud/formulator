<div [formGroup]="formGroup" class="flex flex-col">
  <!-- Label -->
  <app-builder-prop-label [labelMessage]="'Ask your responder a question...'" />
  <!-- Result Display -->
  <input
    type="text"
    class="block w-full rounded-3xl bg-white border border-gray-300 py-2 px-4 text-gray-400 text-sm shadow-inner select-none"
    [ngClass]="{ 'h-28 pt-4 pb-20': field.fieldType === FieldType.TEXTAREA }"
    placeholder="Responder input preview"
    disabled
  />
  <!-- Validation -->
  <app-builder-validation [field]="field" />
</div>
