<div class="flex flex-col gap-3 p-3 rounded-[24px] border border-gray-300 bg-gray-100">
  <div class="flex items-center gap-2">
    <input
      #optionInput
      type="text"
      placeholder="Add option..."
      class="flex-1 px-3 py-2 text-sm rounded-full border border-gray-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
      (keydown.enter)="addOption_C(optionInput)"
    />
    <button
      type="button"
      class="px-3 py-2 text-sm font-medium rounded-full bg-blue-500 text-white hover:bg-blue-600 active:scale-95 transition"
      (click)="addOption_C(optionInput)"
    >
      Add
    </button>
  </div>
  <div class="flex flex-wrap gap-2">
    @for (option of field.options; track $index) {
    <div
      class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-gray-300 text-sm text-gray-700"
    >
      <span>{{ option }}</span>

      <button
        type="button"
        class="flex items-center justify-center w-4 h-4 rounded-full text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition"
        aria-label="Remove option"
        (click)="deleteOption_C($index)"
      >
        ×
      </button>
    </div>
    }
  </div>
</div>
