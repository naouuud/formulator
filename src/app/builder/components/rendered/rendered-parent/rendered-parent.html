<div class="flex flex-col flex-1 overflow-hidden bg-slate-50">
  <div class="px-6 py-3 border-b border-slate-200 bg-white shrink-0">
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Spread Preview</p>
  </div>
  <div class="flex-1 overflow-auto p-6">
    <p>Page: {{ activePageIdx() }}</p>
    @if (activePage(); as page) {
      <app-rendered-page [page]="page" />
    } @else {
      <p class="text-sm text-slate-400">No page to preview.</p>
    }
  </div>
</div>
