@if (noteElement(); as element) {
  @if (element.el; as note) {
    <div class="rounded-xl border border-amber-200 bg-amber-50/60 px-4 py-3">
      <p class="text-[10px] font-semibold text-amber-600 uppercase tracking-widest mb-1">Note</p>
      <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">
        {{ note.value || 'Empty note' }}
      </p>
    </div>
  }
}
