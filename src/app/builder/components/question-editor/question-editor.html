<div class="flex h-full">
  @if (isOptionsQuestion(element().el)) {
    <app-options-panel [element]="element()" />
  }

  <div
    class="w-96 shrink-0 border-l border-slate-200 p-6 flex flex-col gap-5 overflow-auto bg-white h-full"
  >
    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Edit Question</h3>

    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-500">Type</label>
      <span class="text-sm font-mono px-2 py-1 bg-slate-100 text-slate-600 rounded w-fit">{{
        element().el.htmlType
      }}</span>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-slate-500" for="question-label">Label</label>
      <input
        id="question-label"
        class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500 transition-colors"
        placeholder="Enter question label"
        [value]="labelValue()"
        (input)="onLabelInput($event)"
      />
    </div>

    <div class="flex items-center justify-between gap-3">
      <label class="text-xs font-medium text-slate-500" for="question-required">Required</label>
      <button
        id="question-required"
        type="button"
        role="switch"
        [attr.aria-checked]="requiredValue()"
        class="relative w-10 h-6 rounded-full transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2"
        [class.bg-violet-600]="requiredValue()"
        [class.bg-slate-200]="!requiredValue()"
        (click)="toggleRequired()"
      >
        <span
          class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow-sm transition-transform"
          [class.translate-x-4]="requiredValue()"
        ></span>
      </button>
    </div>
  </div>
</div>
