<div class="relative w-72 shrink-0 border-l border-slate-200 bg-white h-full flex flex-col">
  @if (editingOptionId()) {
    <div class="absolute inset-0 z-10" (click)="cancelEdit()"></div>
  }

  <div class="p-6 flex flex-col gap-5 overflow-auto h-full">
    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Options</h3>

    <!-- List of options -->
    <ul class="flex flex-col gap-1">
      @for (option of options(); track option.id) {
        <li
          class="relative flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-slate-50 border text-sm transition-colors"
          [class.z-20]="editingOptionId() === option.id"
          [class.border-violet-300]="editingOptionId() === option.id"
          [class.bg-violet-50]="editingOptionId() === option.id"
          [class.border-slate-200]="editingOptionId() !== option.id"
          [class.text-slate-700]="editingOptionId() !== option.id"
        >
          @if (editingOptionId() === option.id) {
            <div
              class="absolute bottom-full left-0 right-0 mb-2"
              (click)="$event.stopPropagation()"
            >
              <div
                class="relative bg-white border border-slate-200 rounded-lg shadow-md p-2.5 flex gap-2"
              >
                <div
                  class="absolute -bottom-1.5 left-4 w-3 h-3 bg-white border-r border-b border-slate-200 rotate-45"
                ></div>
                <input
                  type="text"
                  autofocus
                  class="relative flex-1 min-w-0 border border-slate-200 rounded-md px-2.5 py-1.5 text-sm focus:outline-none focus:border-violet-500 transition-colors"
                  placeholder="Option label"
                  [value]="editLabelValue()"
                  (input)="setEditLabelValue($event)"
                  (keydown.enter)="saveEdit()"
                />
              </div>
            </div>
          }

          <button
            type="button"
            class="min-w-0 flex-1 truncate text-left cursor-pointer hover:text-violet-700 transition-colors"
            (click)="startEdit(option, $event)"
          >
            {{ option.label }}
          </button>
          <button
            type="button"
            class="shrink-0 w-4 h-4 flex items-center justify-center rounded-full text-slate-300 hover:text-slate-600 hover:bg-slate-200 transition-colors text-[10px]"
            (click)="deleteOption(option.id, $event)"
            title="Delete option"
          >
            ✕
          </button>
        </li>
      } @empty {
        <li class="text-sm text-slate-400 italic py-1">No options yet.</li>
      }
    </ul>

    <!-- Add option -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-slate-500" for="option-input">Add option</label>
      <div class="flex gap-2">
        <input
          id="option-input"
          type="text"
          class="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500 transition-colors"
          placeholder="Option label"
          [value]="labelValue()"
          (input)="setLabelValue($event)"
          (keydown.enter)="addOption()"
        />
        <button
          class="shrink-0 px-3 py-2 bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
          [disabled]="!labelValue().trim()"
          (click)="addOption()"
        >
          Add
        </button>
      </div>
    </div>
  </div>
</div>
