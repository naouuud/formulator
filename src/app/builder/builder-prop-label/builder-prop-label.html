<input
  type="text"
  class="block w-full rounded-full bg-gray-200 px-3 py-2 text-md font-medium text-gray-900 transition-all duration-200 ease-out focus:outline-none focus:bg-white focus:shadow-lg focus:-translate-y-0.5 focus:ring-2 focus:ring-blue-400 focus:mb-1"
  [placeholder]="labelMessage"
  formControlName="label"
  maxlength="100"
  (keydown.enter)="endEdit($event)"
  (mouseenter)="dragDisabled$.set(true)"
  (mouseleave)="dragDisabled$.set(false)"
/>
