<label
  class="group flex items-center gap-3 cursor-pointer transition hover:bg-gray-50 hover:border-gray-300 peer-checked:bg-gray-50 peer-checked:border-gray-400"
>
  <!-- Native input -->
  <!-- <input type="radio" class="peer sr-only" [name]="field.fieldId" /> -->
  <!-- Custom radio -->
  <span
    class="relative flex items-center justify-center w-4 h-4 rounded-full border-2 border-gray-300 transition peer-checked:border-blue-500"
  >
    <span
      class="w-2 h-2 rounded-full bg-blue-500 scale-0 peer-checked:scale-100 transition-transform"
    ></span>
  </span>
  <!-- Option text -->
  <span class="text-sm text-gray-700">
    {{ option }}
  </span>
</label>
