<div class="flex flex-col gap-2">
  <!-- Label -->
  <app-builder-prop-label [labelMessage]="'Ask your responder a question...'" />
  <!-- Preview -->
  <div class="relative">
    <input
      type="text"
      class="block w-full rounded-2xl bg-white border border-gray-300 py-2 px-4 placeholder:text-gray-400 text-sm shadow-inner select-none h-28 pt-4 pb-20"
      placeholder="Responder input preview"
      disabled
    />
    <div class="absolute bottom-2 right-3 text-xs text-gray-400 select-none">
      0 / {{ node.getPropValue(PropType.MAXLENGTHWORD) }}
    </div>
  </div>

  <!-- Validation -->
  <app-builder-validation [node]="node" />
</div>
