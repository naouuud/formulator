<div class="flex flex-col gap-2">
  <!-- Label -->
  <app-builder-prop-label [labelMessage]="'Give your group a name...'" />
  <!-- Validation -->
  <app-builder-validation [node]="node" />
  <!-- Children -->
  @for (child of node.children; track $index) {
    <div [formGroup]="getFormGroup(child.nodeId)">
      <app-builder-node [node]="child" [nodeFormGroup]="getFormGroup(child.nodeId)" />
    </div>
  }
</div>
