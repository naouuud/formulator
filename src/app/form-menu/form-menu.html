<div class="text-white ml-2 mb-4">My Forms</div>
<div class="grid grid-cols-2 gap-y-12 gap-x-8">
  @for (form of forms$(); track $index) {
    <app-form-icon [index]="$index" [formTitle]="form.formTitle" [formId]="form.formId" />
  }
  <div
    (click)="addForm_C()"
    class="h-40 w-28 bg-gray-200/80 text-gray-400 font-medium text-2xl flex items-center justify-center text-center rounded-md hover:cursor-pointer"
  >
    New <br />
    Form
  </div>
</div>
