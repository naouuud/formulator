<div class="flex gap-4">
  @for (field of field.fields; track $index) {
  <div class="flex flex-col flex-1">
    <label [for]="field.fieldId" class="block text-md font-medium text-gray-900 mb-1">
      {{ field.label }}
    </label>
    <input
      [id]="field.fieldId"
      type="text"
      class="block w-full bg-gray-50 p-2 pr-14 border border-gray-300 rounded-md focus:ring-gray-500 focus:border-gray-500 placeholder-gray-400"
      [placeholder]="field.placeholder"
      [attr.maxlength]="field.maxLength"
    />
  </div>
  }
</div>
