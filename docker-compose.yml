services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formulator
      POSTGRES_PASSWORD: formulator
      POSTGRES_DB: formulator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formulator -d formulator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
