@if (uiStore.publishModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <button
      type="button"
      class="absolute inset-0 bg-slate-900/40"
      aria-label="Close publish dialog"
      (click)="close()"
    ></button>

    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="publish-modal-title"
      class="relative w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-lg overflow-hidden"
    >
      <div class="px-6 pt-6 pb-4 border-b border-slate-100">
        <p class="text-[10px] font-semibold uppercase tracking-widest text-violet-600">Publish</p>
        <h2 id="publish-modal-title" class="mt-1 text-lg font-semibold text-slate-800">
          Set published edition title
        </h2>
        <p class="mt-1.5 text-sm text-slate-500 leading-relaxed">
          This is the form title respondents will see. It is saved with this edition and does not
          change your spread name in the builder.
        </p>
      </div>

      <div class="px-6 py-5 flex flex-col gap-1.5">
        <label class="text-xs font-medium text-slate-500" for="publish-edition-title">
          Edition title
        </label>
        <input
          id="publish-edition-title"
          type="text"
          autofocus
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder:text-slate-300 focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 transition-colors"
          placeholder="e.g. Customer feedback Q3"
          [value]="draftTitle()"
          (input)="onTitleInput($event)"
        />
        <p class="text-xs text-slate-400 leading-relaxed">
          Each publish creates a new edition. Responses stay separate per edition.
        </p>
      </div>

      <div
        class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-100 bg-slate-50/80"
      >
        <button
          type="button"
          class="px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 transition-colors"
          [disabled]="domainStore.activeSnapLoading()"
          (click)="close()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="inline-flex items-center justify-center gap-2 min-w-[5.5rem] px-4 py-2 rounded-lg bg-violet-600 text-white text-sm font-medium hover:bg-violet-700 disabled:opacity-50 transition-colors"
          [disabled]="
            !draftTitle().trim() || domainStore.activeSnapLoading() || uiStore.spreadSaving()
          "
          (click)="confirmPublish()"
        >
          @if (domainStore.activeSnapLoading()) {
            <span
              class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"
              aria-label="Publishing"
            ></span>
          }
          Publish
        </button>
      </div>
    </div>
  </div>
}
