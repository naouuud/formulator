@if (store.schemaLoading()) {
  <div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-8">
    <div
      class="w-full max-w-md rounded-2xl border border-slate-200 bg-white px-6 py-10 text-center shadow-sm"
    >
      <div
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-violet-50"
        aria-hidden="true"
      >
        <svg
          class="h-6 w-6 animate-spin text-violet-600"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-slate-900">Loading form</h1>
      <p class="mt-2 text-sm leading-relaxed text-slate-500">Please wait a moment…</p>
    </div>
  </div>
} @else if (store.schemaLoadError()) {
  <div class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-8">
    <div
      class="w-full max-w-md rounded-2xl border border-slate-200 bg-white px-6 py-10 text-center shadow-sm"
    >
      <div
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-red-500"
        aria-hidden="true"
      >
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4M12 16h.01" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-slate-900">Could not load this form</h1>
      <p class="mt-2 text-sm leading-relaxed text-slate-500">
        This link may be expired, invalid, or temporarily unavailable. Please check the link and try
        again.
      </p>
    </div>
  </div>
} @else if (store.schema()) {
  <form-parent />
}
